spring.application.name=ksport-backend
server.port=8080

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/ksport?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=

# --- JPA ---
# Giữ nguyên tên bảng/cột như trong SQL (SanPham, MaSP...), không đổi sang snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Địa chỉ frontend được phép gọi API (dev)
ksport.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
