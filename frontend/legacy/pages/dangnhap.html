<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form đăng nhập</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0d0d12;
            color: #f8f9fa;
        }

        .card {
            background-color: #191923;
            border: 1px solid #343a40;
            border-radius: 12px;
        }

        .form-control {
            background-color: #0d0d12;
            border: 1px solid #343a40;
            color: #f8f9fa;
        }

        .form-control:focus {
            background-color: #0d0d12;
            border-color: #198754;
            color: #f8f9fa;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
        }
    </style>
</head>

<body>

    <div id="header-container"></div>

    <div class="container my-5 py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-4 p-sm-5">
                        <h3 class="text-center text-success fw-bold mb-4"><i class="bi bi-box-arrow-in-right">
                            </i>Đăng nhập</h3>
                        <form action="" method="POST">
                            <div class="mb-4">
                                <label for="email" class="form-label text-white">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Nhập email" required>
                            </div>
                            <div class="mb-4">
                                <label for="sdt" class="form-label text-white">Số điện thoại</label>
                                <input type="tel" class="form-control" id="sdt" placeholder="Nhập số điện thoại"
                                    required>
                            </div>
                            <div class="mb-4">
                                <label for="matkhau" class="form-label text-white">Mật khẩu</label>
                                <input type="password" class="form-control" id="matkhau" placeholder="Nhập mật khẩu"
                                    required>
                            </div>
                            <div class="d-flex justify-content-end mb-3">
                                <a href="#" class="text-success text-decoration-none small ms-auto">Quên mật khẩu</a>
                            </div>
                            <button class="btn btn-success w-100 fw-bold mb-3">Đăng nhập</button>

                            <p class="text-center text-secondary small mb-0">Chưa có tài khoản?
                                <a href="dangky.html" class="text-success fw-bold text-decoration-none">Đăng ký ngay</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>
